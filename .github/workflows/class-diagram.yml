name: Class Diagram

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  diagram:
    runs-on: ubuntu-latest

    env:
      # The diagram in docs/ describes the default branch, not the tag: a release event
      # checks out and commits there, so what Pages serves is the current design.
      BRANCH: ${{ github.event.repository.default_branch }}
      PLANTUML: 1.2026.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install php-class-diagram
        # Outside the project: the tool brings its own nikic/php-parser, and this package's
        # static analysers pin theirs.
        run: |
          mkdir -p /tmp/pcd
          echo '{}' > /tmp/pcd/composer.json
          composer require --no-interaction --quiet --working-dir=/tmp/pcd smeghead/php-class-diagram

      - name: Install PlantUML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz
          curl -sL -o /tmp/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML}/plantuml-${PLANTUML}.jar"

      - name: Generate
        # Only this job writes docs/diagrams: PlantUML lays text out with the fonts it finds, so
        # the same input renders 66px wider on a mac than on the runner. Regenerating by hand puts
        # the repository in a loop of geometry-only commits.
        run: |
          # Clear first: a renamed diagram would otherwise be served forever from the old file.
          rm -rf docs/diagrams
          mkdir -p docs/diagrams
          # The tool links each class by its path relative to the directory it was given, so the
          # top URL has to be that same directory - one shared `src` sends every subnamespace to
          # a 404.
          pcd() {
            target=$1; shift
            php /tmp/pcd/vendor/bin/php-class-diagram \
              --svg-topurl="https://github.com/${GITHUB_REPOSITORY}/blob/${BRANCH}/${target}" \
              "$@" "$target"
          }
          render() { java -jar /tmp/plantuml.jar -tsvg -pipe > "docs/diagrams/$1.svg"; }

          # The whole package on one canvas: methods and public properties of every class, laid
          # out left to right because top to bottom puts 97 classes in a 24800px row. It is a
          # reference to zoom into - the diagrams below are the ones that are read.
          pcd src --hide-private-properties --header='left to right direction' | render all

          # By concern, not one diagram of everything: the root namespace is flat and 60 classes
          # wide, and drawing it whole buries the boxes under their own dependency arrows.
          pcd src --include='*Interceptor.php' --include='*Command*.php' | render interceptor
          pcd src --include='*Storage*.php' --include='*Repository*.php' --include='*Etag*.php' \
            --include='ResourceState.php' | render store
          pcd src --include='*Module.php' | render module
          pcd src --exclude='*Interceptor.php' --exclude='*Command*.php' --exclude='*Storage*.php' \
            --exclude='*Repository*.php' --exclude='*Etag*.php' --exclude='*Module.php' \
            --exclude='Log' --exclude='Cdn' --exclude='Exception' | render http-cache
          pcd src/Log | render log
          pcd src/Cdn | render cdn
          pcd src/Exception | render exception
          pcd src-annotation | render attributes

          # What the modules bind, which no class diagram shows: dashed is a binding, solid a
          # dependency, and a double arrow means a Provider stands between them.
          php bin/gen_og.php

      - name: Check every link resolves
        # The links are the reason these are SVG. A wrong top URL is invisible in the picture:
        # it renders the same and every box leads to a 404.
        run: |
          status=0
          for svg in docs/diagrams/*.svg; do
            grep -o 'xlink:href="[^"]*"' "$svg" | sed 's/xlink:href="//;s/"$//' | sort -u |
            while read -r url; do
              case "$url" in https://github.com/*) ;; *) continue ;; esac
              path=${url#https://github.com/${GITHUB_REPOSITORY}/blob/${BRANCH}/}
              [ -f "$path" ] || { echo "$svg: $url does not exist in the checkout"; exit 1; }
            done || status=1
          done
          exit $status

      - name: Commit when the design changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/diagrams
          git diff --cached --quiet && { echo 'no change'; exit 0; }
          git commit -m 'Update class diagrams'
          git push origin "HEAD:${BRANCH}"
